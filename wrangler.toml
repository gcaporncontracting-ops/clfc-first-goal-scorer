name = "clfc-first-goal-scorer"
main = "src/worker.js"
compatibility_date = "2026-08-10"

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "clfc-first-goal-scorer"
database_id = "050e6010-0ba6-400f-a64d-30b3f1168b78"

# Shared with Warriors-vote-v2 — this app only ever calls .get() on it,
# never .put()/.delete(). Used for PIN auth (pinused:{pin} reverse index)
# and mock roster data (gradelist:{grade}).
[[kv_namespaces]]
binding = "VOTES_KV"
id = "5484efe25986416ca14a9072c6b841dd"

# Automated PlayHQ sync every Saturday at 6:00 AM AWST (22:00 UTC Friday)
[triggers]
crons = ["0 22 * * 5"]

[vars]
PLAYHQ_API_KEY = "ENTER_YOUR_API_KEY_HERE"
